name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do release (v1.1.5)'
        required: true
        default: 'v1.1.5'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: evefit_tracker
        run: flutter pub get

      - name: Analyze
        working-directory: evefit_tracker
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: evefit_tracker
        run: flutter test

      - name: Configure official release signing
        working-directory: evefit_tracker
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_RELEASE_KEYSTORE_BASE64:?ANDROID_RELEASE_KEYSTORE_BASE64 is required}"
          : "${ANDROID_RELEASE_KEYSTORE_PASSWORD:?ANDROID_RELEASE_KEYSTORE_PASSWORD is required}"
          : "${ANDROID_RELEASE_KEY_ALIAS:?ANDROID_RELEASE_KEY_ALIAS is required}"
          : "${ANDROID_RELEASE_KEY_PASSWORD:?ANDROID_RELEASE_KEY_PASSWORD is required}"
          umask 077
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" |
            base64 --decode > android/app/release-keystore.jks
          test -s android/app/release-keystore.jks
          printf '%s\n' \
            'storeFile=release-keystore.jks' \
            "storePassword=$ANDROID_RELEASE_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_RELEASE_KEY_ALIAS" \
            "keyPassword=$ANDROID_RELEASE_KEY_PASSWORD" \
            > android/key.properties

      - name: Build APK
        working-directory: evefit_tracker
        run: flutter build apk --release

      - name: Set version name
        id: version
        run: echo "name=${{ github.event.inputs.version || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Verify release APK identity and signing
        working-directory: evefit_tracker
        env:
          RELEASE_TAG: ${{ steps.version.outputs.name }}
          EXPECTED_RELEASE_CERTIFICATE_SHA256: 59042D19D9B0CEA872A34CD0D1FD3A268F322B8819D1D6E3849B5761DB17230B
        run: |
          set -euo pipefail
          pubspec_version="$(awk '$1 == "version:" {print $2; exit}' pubspec.yaml)"
          expected_version_name="${pubspec_version%%+*}"
          expected_version_code="${pubspec_version##*+}"
          expected_tag="v${expected_version_name}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match pubspec version $pubspec_version." >&2
            exit 1
          fi
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          build_tools_dir="$(
            find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d |
              sort -V |
              tail -n 1
          )"
          echo "Android build-tools: $(basename "$build_tools_dir")"
          echo "apksigner version:"
          "$build_tools_dir/apksigner" --version
          RUN_RELEASE_APK_INTEGRATION_TEST=true \
          EVEFIT_RELEASE_APK=build/app/outputs/flutter-apk/app-release.apk \
          EVEFIT_RELEASE_PACKAGE=com.sandro.evefittracker \
          EVEFIT_RELEASE_VERSION_NAME="$expected_version_name" \
          EVEFIT_RELEASE_VERSION_CODE="$expected_version_code" \
          EVEFIT_RELEASE_CERTIFICATE_SHA256="$EXPECTED_RELEASE_CERTIFICATE_SHA256" \
            flutter test \
              test/release/release_apk_verifier_integration_test.dart \
              -r compact
          dart run tool/release/verify_release_apk.dart \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --expected-package com.sandro.evefittracker \
            --expected-version-name "$expected_version_name" \
            --expected-version-code "$expected_version_code" \
            --expected-certificate-sha256 "$EXPECTED_RELEASE_CERTIFICATE_SHA256"

      - name: Prepare release APK
        if: github.event_name == 'push'
        working-directory: evefit_tracker
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/EveFit-v1.1.5-wave1-non-muscular-exercises-release.apk
          (
            cd build/app/outputs/flutter-apk
            sha256sum EveFit-v1.1.5-wave1-non-muscular-exercises-release.apk > EveFit-v1.1.5-SHA256SUMS.txt
          )

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: EveFit v1.1.5 — Primeiros exercícios canónicos
          files: |
            evefit_tracker/build/app/outputs/flutter-apk/EveFit-v1.1.5-wave1-non-muscular-exercises-release.apk
            evefit_tracker/build/app/outputs/flutter-apk/EveFit-v1.1.5-SHA256SUMS.txt
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            ## EveFit Tracker ${{ steps.version.outputs.name }}

            ### Novidades v1.1.5
            - Adicionados 49 exercícios não musculares aprovados.
            - As intenções compatíveis passam a apresentar exercícios disponíveis.
            - Cada exercício possui explicação detalhada para principiantes.
            - Foram adicionadas instruções passo a passo, preparação, respiração, erros comuns e segurança.
            - Exercícios de exigência elevada apresentam avisos próprios.
            - Foram adicionadas três variantes de exercícios.
            - Esta versão ainda não adiciona os exercícios diretamente aos treinos.
            - Conteúdo muscular, prescrições automáticas e multimédia continuam em preparação.

            ### Informação técnica
            - 49 exercícios, 88 relações públicas, 50 intenções e 54 percursos.
            - 66 relações condicionais permanecem desativadas.
            - Schema SQLite 22 e migrations inalterados.

            ### Novidades v0.9.4
            - Alfandega permanente dos catalogos com auditoria strict, inventario e gap analysis.
            - Passadeira corrigida nos filtros de cardio, com entradas essenciais para resistencia, ritmos, intervalos, HIIT e inclinacao.
            - Adductor squeeze leve revisto com instrucao real para iniciantes e musculos corretos.
            - Quality gates passam a bloquear IDs, filtros, linguagem, conteudo, seguranca, equipamento e locais invalidos.
            - Atualizada versao da app para v0.9.4.

            ### Novidades v0.9.3
            - Catálogo expandido de 315 para 353 exercícios: coifa do ombro, pescoço, core anti-rotação, glúteo médio, isquiotibiais excêntricos e equilíbrio unilateral.
            - Cardio novo: remo ergómetro, stepper/escadas, air bike, shadow boxing, shuttle runs e subida de escadas, com filtros próprios.
            - Alongamentos PNF, flexores da anca, adutores, tríceps e cobra; rotinas de aquecimento e arrefecimento guiadas.
            - Karate: bases, bloqueios, esquivas, joelhadas e trabalho ao saco. Jiu-Jitsu: rolamentos, breakfalls e inversões.
            - Recuperação: respiração nasal, foam roller e bola de massagem.
            - Todos os exercícios novos com instruções passo a passo escritas de raiz; filtros validados e migração segura do catálogo.
            - Atualizada versão da app para v0.9.3.

            ### Novidades v0.9.1
            - Explicações de todos os 315 exercícios reescritas: objetivo curto, passos em lista, erros comuns e variações concretas.
            - Corrigida a linguagem errada de equipamento (ex.: exercícios de peso corporal já não falam em "carga").
            - Flexão diamante, Curl arrastado e Tate press ensinados corretamente passo a passo.
            - Novo modal de detalhes do exercício, com secções e listas fáceis de ler no telemóvel.
            - Atualização segura do catálogo em instalações existentes, sem tocar em exercícios personalizados nem no histórico.
            - Atualizada versão da app para v0.9.1.

            ### Novidades v0.9.0
            - Corrigida a filtragem de exercícios por músculo específico: cada foco mostra apenas os exercícios certos.
            - Corrigida a disponibilidade por local de treino e equipamento (ginásio, casa, exterior, dojo).
            - Revistos um a um os textos dos exercícios: passos de execução específicos para cada variação, escritos para principiantes.
            - Corrigidos exercícios com instruções da família errada (Curl de perna, Extensão de perna, Leg press).
            - Removidas frases genéricas das instruções e reforçados os testes de qualidade do catálogo.
            - Atualizada versão da app para v0.9.0.

            ### Instalação
            Descarrega `EveFit-v1.1.5-wave1-non-muscular-exercises-release.apk` e instala no Android (permite instalação de fontes desconhecidas nas definições).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published release assets
        if: github.event_name == 'push'
        working-directory: evefit_tracker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.name }}
          EXPECTED_RELEASE_CERTIFICATE_SHA256: 59042D19D9B0CEA872A34CD0D1FD3A268F322B8819D1D6E3849B5761DB17230B
        run: |
          set -euo pipefail
          published_directory="$(mktemp -d)"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'EveFit-v1.1.5-wave1-non-muscular-exercises-release.apk' \
            --pattern 'EveFit-v1.1.5-SHA256SUMS.txt' \
            --dir "$published_directory"
          cmp --silent \
            build/app/outputs/flutter-apk/EveFit-v1.1.5-wave1-non-muscular-exercises-release.apk \
            "$published_directory/EveFit-v1.1.5-wave1-non-muscular-exercises-release.apk"
          (
            cd "$published_directory"
            sha256sum -c EveFit-v1.1.5-SHA256SUMS.txt
          )
          dart run tool/release/verify_release_apk.dart \
            --apk "$published_directory/EveFit-v1.1.5-wave1-non-muscular-exercises-release.apk" \
            --expected-package com.sandro.evefittracker \
            --expected-version-name 1.1.5 \
            --expected-version-code 7 \
            --expected-certificate-sha256 "$EXPECTED_RELEASE_CERTIFICATE_SHA256"

      - name: Remove temporary signing files
        if: always()
        working-directory: evefit_tracker
        run: rm -f android/key.properties android/app/release-keystore.jks
