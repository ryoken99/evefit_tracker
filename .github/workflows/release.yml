name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do release (v0.8.0)'
        required: true
        default: 'v0.8.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: evefit_tracker
        run: flutter pub get

      - name: Analyze
        working-directory: evefit_tracker
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: evefit_tracker
        run: flutter test

      - name: Build APK
        working-directory: evefit_tracker
        run: flutter build apk --release

      - name: Set version name
        id: version
        run: echo "name=${{ github.event.inputs.version || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: ${{ steps.version.outputs.name }}
          files: evefit_tracker/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: false
          body: |
            ## EveFit Tracker ${{ steps.version.outputs.name }}

            ### Novidades v0.8.0
            - Corrigido isolamento de objetivos e milestones por perfil.
            - Corrigido isolamento de equipamentos e locais por perfil.
            - Corrigidos filtros anatómicos dos exercícios.
            - Revistas descrições e execuções individuais dos exercícios.
            - Expandido catálogo de exercícios por músculo, equipamento e local.
            - Corrigido encoding corrompido.
            - Corrigida associação de templates a exercícios.
            - Melhoradas validações e testes.
            - Atualizada versão da app para v0.8.0.

            ### Instalação
            Descarrega o ficheiro `app-release.apk` e instala no Android (permite instalação de fontes desconhecidas nas definições).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
